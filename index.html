<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruota della Fortuna Saretta</title>
    
    <!-- Script ufficiale di Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            /* Sfondo scuro e griglia simile all'immagine originale */
            background-color: #2b2b2b;
            background-image: radial-gradient(#3c3c3c 1px, transparent 1px);
            background-size: 15px 15px;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: normal;
        }

        .header h2 {
            margin: 5px 0 0 0;
            color: #888;
            font-size: 28px;
            font-weight: bold;
        }

        /* Testo informativo per il collegamento */
        .info-link {
            font-size: 14px;
            color: #bbb;
            margin-top: 5px;
        }

        .wheel-container {
            position: relative;
            width: 350px;
            height: 350px;
        }

        /* Il Canvas che disegna la ruota */
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
            /* Bordo esterno bianco per un look pulito */
            background-color: white; 
            padding: 5px; 
            box-sizing: border-box;
        }

        /* Il bottone centrale "Spin" */
        .spin-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background-color: #111;
            color: white;
            border-radius: 50%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border: 3px solid white;
            user-select: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Il triangolino nero che fa da puntatore sopra il pulsante */
        .spin-btn::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 25px solid white;
            z-index: -1;
        }
        
        .spin-btn::after {
            content: '';
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 11px solid transparent;
            border-right: 11px solid transparent;
            border-bottom: 20px solid #111;
            z-index: -1;
        }

        /* Feedback visivo quando si clicca */
        .spin-btn:active {
            transform: translate(-50%, -50%) scale(0.95);
        }
        
        /* Cursore non disponibile durante la rotazione */
        .spin-btn.disabled {
            cursor: not-allowed;
            background-color: #555;
            color: #bbb;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Ruota della Fortuna Saretta</h1>
        <h2>Spin the wheel</h2>
        <!-- Testo per ricordarti l'integrazione con Telegram -->
        <p class="info-link">(Collega qui il tuo Bot Telegram Web App)</p>
    </div>
    
    <div class="wheel-container">
        <!-- Bottone Centrale -->
        <div class="spin-btn" id="spinBtn">Spin</div>
        <!-- Il Canvas disegnato in JS -->
        <canvas id="wheel" width="600" height="600"></canvas>
    </div>

    <script>
        // Inizializza Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();

        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        
        // I 8 spicchi base da replicare
        const baseSlices = [
            { text: "Sex chat fino 15", color: "#4DA6FF", textColor: "#fff" }, // Blu
            { text: "Nulla", color: "#FFCC00", textColor: "#000" },            // Giallo
            { text: "Foto patatina", color: "#FF6600", textColor: "#fff" },    // Arancione
            { text: "Nulla", color: "#FF0066", textColor: "#fff" },            // Fucsia
            { text: "Dickrating vocale", color: "#FFCC00", textColor: "#000" },// Giallo
            { text: "Video già pronto", color: "#FF6600", textColor: "#fff" }, // Arancione
            { text: "Foto tette", color: "#FF0066", textColor: "#fff" },       // Fucsia
            { text: "Video bolla perso", color: "#9933FF", textColor: "#fff" }// Viola
        ];
        
        // Creiamo la ruota completa a 16 spicchi
        const slices = [...baseSlices, ...baseSlices];
        const numSlices = slices.length;
        const sliceAngle = (2 * Math.PI) / numSlices;
        
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        // Raggio leggermente ridotto per mostrare il bordo bianco
        const radius = centerX - 5; 

        // Funzione per disegnare la ruota sul canvas
        function drawWheel() {
            // Pulisci il canvas prima di ridisegnare
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < numSlices; i++) {
                const startAngle = i * sliceAngle;
                const endAngle = startAngle + sliceAngle;
                
                // 1. Disegna la fetta colorata
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = slices[i].color;
                ctx.fill();
                
                // 2. Disegna il bordo tra gli spicchi
                ctx.lineWidth = 1;
                ctx.strokeStyle = "#ffffff";
                ctx.stroke();

                // 3. Aggiungi il testo, orientato verso l'esterno
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillStyle = slices[i].textColor;
                // Carattere leggermente ridotto per evitare overflow
                ctx.font = "bold 22px Arial"; 
                
                // Posiziona il testo vicino al bordo esterno
                ctx.fillText(slices[i].text, radius - 30, 0);
                ctx.restore();
            }
        }

        // Richiama la funzione all'avvio
        drawWheel();

        let currentDegree = 0;
        let isSpinning = false;

        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.classList.add('disabled'); // Disabilita il pulsante visivamente

            // Giri completi casuali + offset per l'angolo finale
            const randomDegree = Math.floor(Math.random() * 360) + (360 * 8); 
            currentDegree += randomDegree;

            // Applica la rotazione visiva con CSS
            canvas.style.transform = rotate(${currentDegree}deg);
            
            // Aspetta 4 secondi (tempo dell'animazione)
            setTimeout(() => {
                isSpinning = false;
                spinBtn.classList.remove('disabled');

                // Calcola quale spicchio si trova sotto il puntatore fisso in alto
                const actualDegree = currentDegree % 360;
                const pointerAngle = (270 - actualDegree + 360) % 360;
                
                // Troviamo l'indice dello spicchio vincente
                const winningIndex = Math.floor(pointerAngle / (360 / numSlices));
                const prize = slices[winningIndex].text;

                // Mostra il risultato a schermo come test
                alert(Hai vinto: ${prize}! (TEST COMPLETATO));
                
                // Se il sito è aperto dentro Telegram Web App, invia il dato al bot
                if (tg.initDataUnsafe && Object.keys(tg.initDataUnsafe).length > 0) {
                    tg.sendData(prize); 
                }
                
            }, 4000); 
        });
    </script>
</body>
</html>
