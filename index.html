<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ruota della Fortuna</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #f5f5f5;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #222;
}

.container {
  width: 100%;
  max-width: 500px;
  text-align: center;
  padding: 20px;
}

h1 {
  margin: 0 0 8px;
  font-size: 30px;
}

.giri {
  font-size: 18px;
  margin-bottom: 20px;
}

.ruota-container {
  position: relative;
  width: 90vw;
  max-width: 420px;
  aspect-ratio: 1;
  margin: auto;
}

canvas {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  display: block;
  transition: transform 5s cubic-bezier(.12,.72,.18,1);
}

.freccia {
  position: absolute;
  top: -5px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 20px solid transparent;
  border-right: 20px solid transparent;
  border-top: 38px solid #111;
  z-index: 5;
}

button {
  margin-top: 25px;
  padding: 16px 40px;
  border: none;
  border-radius: 15px;
  background: #111;
  color: white;
  font-size: 21px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

#risultato {
  margin-top: 20px;
  min-height: 35px;
  font-size: 24px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🎡 Ruota della Fortuna</h1>

<div class="giri">
Giri disponibili: <strong id="giri">3</strong>
</div>

<div class="ruota-container">

<div class="freccia"></div>

<canvas id="ruota" width="500" height="500"></canvas>

</div>

<button id="gira">🎰 GIRA</button>

<div id="risultato"></div>

</div>

<script>

const premi = [
  "€5",
  "€10",
  "€20",
  "Riprova",
  "€5",
  "€50",
  "€10",
  "Riprova"
];

const canvas = document.getElementById("ruota");
const ctx = canvas.getContext("2d");

const bottone = document.getElementById("gira");
const risultato = document.getElementById("risultato");
const giriText = document.getElementById("giri");

let giri = 3;
let rotazione = 0;
let staGirando = false;

function disegnaRuota() {

  const centro = 250;
  const raggio = 240;
  const fetta = (Math.PI * 2) / premi.length;

  ctx.clearRect(0, 0, 500, 500);

  for (let i = 0; i < premi.length; i++) {

    const inizio = i * fetta;
    const fine = inizio + fetta;

    ctx.beginPath();
    ctx.moveTo(centro, centro);
    ctx.arc(
      centro,
      centro,
      raggio,
      inizio,
      fine
    );
    ctx.closePath();

    ctx.fillStyle =
      i % 2 === 0
      ? "#FFD43B"
      : "#FF6B6B";

    ctx.fill();

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.save();

    ctx.translate(centro, centro);
    ctx.rotate(inizio + fetta / 2);

    ctx.textAlign = "right";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#111";
    ctx.font = "bold 25px Arial";

    ctx.fillText(
      premi[i],
      raggio - 20,
      0
    );

    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(
    centro,
    centro,
    45,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = "#111";
  ctx.fill();

}

disegnaRuota();


bottone.addEventListener("click", function() {

  if (staGirando || giri <= 0) {
    return;
  }

  staGirando = true;
  bottone.disabled = true;

  risultato.textContent = "";

  giri--;
  giriText.textContent = giri;

  const vincitore =
    Math.floor(Math.random() * premi.length);

  const gradiFetta =
    360 / premi.length;

  const gradiFinali =
    360 * 6 +
    (360 - vincitore * gradiFetta - gradiFetta / 2);

  rotazione += gradiFinali;

  canvas.style.transform =
    "rotate(" + rotazione + "deg)";

  setTimeout(function() {

    risultato.textContent =
      "🎉 Hai vinto: " + premi[vincitore];

    staGirando = false;

    if (giri > 0) {
      bottone.disabled = false;
    }

  }, 5200);

});

</script>

</body>
</html>
