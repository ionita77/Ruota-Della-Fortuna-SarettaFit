<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruota della Fortuna</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  text-align: center;
}

h1 {
  margin-top: 30px;
}

.giri {
  font-size: 18px;
  margin: 10px 0 25px;
}

.ruota-box {
  position: relative;
  width: 360px;
  height: 360px;
  max-width: 85vw;
  max-height: 85vw;
  margin: auto;
}

.ruota {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 6px solid #111;
  background: conic-gradient(
    #ffd43b 0deg 45deg,
    #ff6b6b 45deg 90deg,
    #ffd43b 90deg 135deg,
    #ff6b6b 135deg 180deg,
    #ffd43b 180deg 225deg,
    #ff6b6b 225deg 270deg,
    #ffd43b 270deg 315deg,
    #ff6b6b 315deg 360deg
  );
  position: relative;
  transition: transform 5s cubic-bezier(.12,.72,.18,1);
}

.premio {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: bold;
  font-size: 22px;
}

.p1 { transform: rotate(22.5deg) translateY(-125px); }
.p2 { transform: rotate(67.5deg) translateY(-125px); }
.p3 { transform: rotate(112.5deg) translateY(-125px); }
.p4 { transform: rotate(157.5deg) translateY(-125px); }
.p5 { transform: rotate(202.5deg) translateY(-125px); }
.p6 { transform: rotate(247.5deg) translateY(-125px); }
.p7 { transform: rotate(292.5deg) translateY(-125px); }
.p8 { transform: rotate(337.5deg) translateY(-125px); }

.freccia {
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  width: 0;
  height: 0;
  border-left: 20px solid transparent;
  border-right: 20px solid transparent;
  border-top: 40px solid #111;
}

button {
  margin-top: 30px;
  padding: 15px 40px;
  border: 0;
  border-radius: 15px;
  background: #111;
  color: white;
  font-size: 20px;
  font-weight: bold;
}

#result {
  margin-top: 20px;
  font-size: 24px;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>🎡 Ruota della Fortuna</h1>

<div class="giri">
Giri disponibili: <strong id="giri">3</strong>
</div>

<div class="ruota-box">

<div class="freccia"></div>

<div class="ruota" id="ruota">
  
<div class="premio p1">Sex chat<br>15 min</div>
<div class="premio p2">Nulla</div>

<div class="premio p4">Foto<br>patatina</div>
<div class="premio p5">Video bolla<br>personalizzato</div>
<div class="premio p6">Dickrating<br>vocale</div>
<div class="premio p7">Nulla</div>
<div class="premio p8">Foto<br>tette</div>
<div class="premio p9">Video<br>già pronto</div>
<div class="premio p10">Sex chat<br>15 min</div>
<div class="premio p11">Foto<br>tette</div>
<div class="premio p12">Nulla</div>
<div class="premio p13">Video bolla<br>personalizzato</div>
<div class="premio p14">Foto<br>patatina</div>
<div class="premio p15">Dickrating<br>vocale</div>
<div class="premio p16">Video<br>già pronto</div>
  
</div>

</div>

</body>
</html>
