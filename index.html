<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruota della Fortuna</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  text-align: center;
}

h1 {
  margin-top: 30px;
}

.giri {
  font-size: 18px;
  margin: 10px 0 25px;
}

.ruota-box {
  position: relative;
  width: 360px;
  height: 360px;
  max-width: 85vw;
  max-height: 85vw;
  margin: auto;
}

.ruota {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 6px solid #111;
  background: conic-gradient(
    #ffd43b 0deg 45deg,
    #ff6b6b 45deg 90deg,
    #ffd43b 90deg 135deg,
    #ff6b6b 135deg 180deg,
    #ffd43b 180deg 225deg,
    #ff6b6b 225deg 270deg,
    #ffd43b 270deg 315deg,
    #ff6b6b 315deg 360deg
  );
  position: relative;
  transition: transform 5s cubic-bezier(.12,.72,.18,1);
}

.premio {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: bold;
  font-size: 22px;
}

.p1 { transform: rotate(22.5deg) translateY(-125px); }
.p2 { transform: rotate(67.5deg) translateY(-125px); }
.p3 { transform: rotate(112.5deg) translateY(-125px); }
.p4 { transform: rotate(157.5deg) translateY(-125px); }
.p5 { transform: rotate(202.5deg) translateY(-125px); }
.p6 { transform: rotate(247.5deg) translateY(-125px); }
.p7 { transform: rotate(292.5deg) translateY(-125px); }
.p8 { transform: rotate(337.5deg) translateY(-125px); }

.freccia {
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  width: 0;
  height: 0;
  border-left: 20px solid transparent;
  border-right: 20px solid transparent;
  border-top: 40px solid #111;
}

button {
  margin-top: 30px;
  padding: 15px 40px;
  border: 0;
  border-radius: 15px;
  background: #111;
  color: white;
  font-size: 20px;
  font-weight: bold;
}

#result {
  margin-top: 20px;
  font-size: 24px;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>🎡 Ruota della Fortuna</h1>

<div class="giri">
Giri disponibili: <strong id="giri">3</strong>
</div>

<div class="ruota-box">

<div class="freccia"></div>

<div class="ruota" id="ruota">

<div class="premio p1">€5</div>
<div class="premio p2">€10</div>
<div class="premio p3">€20</div>
<div class="premio p4">Riprova</div>
<div class="premio p5">€5</div>
<div class="premio p6">€50</div>
<div class="premio p7">€10</div>
<div class="premio p8">Riprova</div>

</div>

</div>

<button id="gira">🎰 GIRA</button>

<div id="result"></div>

<script>

let giri = 3;
let rotazione = 0;
let girando = false;

const ruota = document.getElementById("ruota");
const bottone = document.getElementById("gira");
const giriText = document.getElementById("giri");
const result = document.getElementById("result");

const premi = [
  "Foto tette",
  "Foto patatina",
  "Dickrating vocale",
  "Riprova",
  "Video coppia",
  "Video squirt",
  "Sexchat",
  "Riprova"
];

bottone.addEventListener("click", function() {

  if (girando || giri <= 0) {
    return;
  }

  girando = true;
  bottone.disabled = true;

  giri--;

  giriText.textContent = giri;

  const vincitore = Math.floor(
    Math.random() * premi.length
  );

  const fetta = 360 / premi.length;

  const movimento =
    2160 +
    (360 - vincitore * fetta - fetta / 2);

  rotazione += movimento;

  ruota.style.transform =
    "rotate(" + rotazione + "deg)";

  setTimeout(function() {

    result.textContent =
      "🎉 Hai vinto: " + premi[vincitore];

    girando = false;

    if (giri > 0) {
      bottone.disabled = false;
    }

  }, 5200);

});

</script>

</body>
</html>
